# Lisence: MIT
# Author: P3TERX
# Blog: https://p3terx.com
#
# 个人 fork 定制 (loadnl/Kwrt):
#   - 默认目标: qualcommax_ipq60xx -> Redmi AX5 JDCloud (redmi_ax5-jdcloud)
#   - 触发方式: Actions 页面手动 Run workflow, 或 repository_dispatch
#   - 只使用 GitHub 内置 GITHUB_TOKEN, 不需要配置任何 secret
#=================================================

name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标 (devices/ 下的目录名)'
        required: true
        default: 'qualcommax_ipq60xx'
      action:
        description: '附加参数, 可留空 (例如 nocache 强制不使用编译缓存)'
        required: false
        default: ''
  repository_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_TOKEN: ${{ github.token }}
  ACTION: ${{ inputs.action }} ${{ github.event.action }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ inputs.target || github.event.client_payload.target }}"]

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    - name: Load Settings.ini
      run: |
        echo "${{ matrix.target }}"
        source "${GITHUB_WORKSPACE}/devices/common/settings.ini"
        if [ -f "devices/${{ matrix.target }}/settings.ini" ]; then
          source "${GITHUB_WORKSPACE}/devices/${{ matrix.target }}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
        echo "FREE_UP_DISK=${FREE_UP_DISK}" >> $GITHUB_ENV
        echo "UPLOAD_BIN_DIR_FOR_ARTIFACT=${UPLOAD_BIN_DIR_FOR_ARTIFACT}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_RELEASE=${UPLOAD_FIRMWARE_FOR_RELEASE}" >> $GITHUB_ENV

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        echo "date3=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        VERSION="$(echo "$ACTION" | grep -Eo ' [0-9]+\.[0-9.]+' | head -n 1 | sed -e 's/ //')" || true
        if [ -n "$VERSION" ]; then
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        else
          echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV
        fi

    - name: Clone source code
      run: |
        set -x
        TAG_INFO="$(curl -gs -H 'Content-Type: application/json' \
           -H "Authorization: Bearer ${{ github.token }}" \
           -X POST -d '{ "query": "query {repository(owner: \"openwrt\", name: \"openwrt\") {refs(refPrefix: \"refs/tags/\", first: 4, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {nodes {name target { ... on Tag {tagger {date}}}}}}}"}' https://api.github.com/graphql)"
        TAG_DATE="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[] | select(.name | startswith("v25")) | .target.tagger.date' | head -n 1)"
        if [[ $(( ($(date +%s) - $(date -d "$TAG_DATE" +%s)) / 86400 )) -lt 10 || "${{ contains(env.ACTION, 'tags') }}" == "true" ]]; then
        REPO_BRANCH="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[].name' | grep v25 | head -n 1)"
        else
        REPO_BRANCH="openwrt-25.12"
        fi
        if [[ ! "${{ env.REPO_BRANCH }}" && "$REPO_URL" == "https://github.com/openwrt/openwrt" ]]; then
            git clone $REPO_URL -b $REPO_BRANCH openwrt
        elif [[ ! "${{ env.REPO_BRANCH }}" ]]; then
            git clone $REPO_URL openwrt
        else
            REPO_BRANCH="${{ env.REPO_BRANCH }}"
            if [[ ${#REPO_BRANCH} -lt 10 ]]; then
                git clone $REPO_URL -b ${REPO_BRANCH} openwrt
            else
                git clone $REPO_URL openwrt
                cd openwrt
                git checkout ${REPO_BRANCH}
            fi
        fi

    - name: Free up disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir
        sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

    - name: Load custom configuration
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
          }
        export -f git_clone_path
        mkdir -p openwrt
        cp -rf devices/common/. openwrt/
        cp -rf devices/${{ matrix.target }}/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH
        /bin/bash "devices/common/$DIY_SH"
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/${{ matrix.target }}/$CONFIG_FILE" ]; then
          echo >> .config
          cat devices/${{ matrix.target }}/$CONFIG_FILE >> .config
        fi
        if [ -f "devices/${{ matrix.target }}/$DIY_SH" ]; then
          chmod +x devices/${{ matrix.target }}/$DIY_SH
          echo "/bin/bash devices/${{ matrix.target }}/$DIY_SH"
          /bin/bash "devices/${{ matrix.target }}/$DIY_SH"
        fi
        cp -Rf ./diy/* ./ || true

    - name: Apply patches
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/${{ matrix.target }}/
          if [ -n "$(ls -A devices/${{ matrix.target }}/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/${{ matrix.target }}/patches/*.bin.patch
          fi
          find "devices/${{ matrix.target }}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/${{ matrix.target }}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

    - name: Defconfig
      run: |
        cd openwrt
        make defconfig
        if [[ ! "${{ matrix.target }}" =~ (amlogic_meson8b|armsr_armv8|bcm27xx_*|rockchip_armv8|sunxi_*|x86_*|siflower_*) ]]; then
        sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
        sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
        make defconfig
        fi
        cat .config

    - name: Verify configuration
      run: |
        cd openwrt
        fail=0
        for sym in \
          "CONFIG_TARGET_qualcommax_ipq60xx=y" \
          "CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_redmi_ax5-jdcloud=y" \
          "CONFIG_PACKAGE_luci-app-open-box=y" ; do
          if grep -qx "$sym" .config; then
            echo "OK   $sym"
          else
            echo "::error::missing in .config -> $sym"
            fail=1
          fi
        done
        if [ "$fail" != "0" ]; then
          echo "--- 相关配置行 ---"
          grep -iE 'ax5|open-box|TARGET_ALL_PROFILES|TARGET_MULTI_PROFILE' .config || true
          exit 1
        fi

    - name: Cache
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'false'
        mixkey: ${{ matrix.target }}
        clean: ${{ contains(env.ACTION, 'nocache') }}
        prefix: ${{ github.workspace }}/openwrt

    - name: SSH connection to Actions
      uses: kiddin9/debugger-action@master
      if: contains(env.ACTION, 'ssh')

    - name: Compile the firmware
      id: compile
      run: |
        shopt -s extglob
        df -hT
        cd openwrt
        echo -e "$(( $(nproc) + 1 )) thread compile"
        make -j$(($(nproc)+1)) || { log=$(mktemp); make V=s &>$log; } || { tail -80 $log; echo "::error::compile failed"; df -hT; exit 1; }
        rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
        rm -rf staging_dir/toolchain-*/initial
        df -hT

    - name: Organize files
      id: organize
      continue-on-error: true
      run: |
        shopt -s extglob
        ls -lh openwrt/bin/targets/*/*/
        cd openwrt/bin/targets/*/*/
        cp $GITHUB_WORKSPACE/openwrt/.config ${{ matrix.target }}.config || true
        cp $GITHUB_WORKSPACE/openwrt/build_dir/target-*/linux-*/linux-*/.config ${{ matrix.target }}_kernel.config || true
        rm -rf kwrt-!(*imagebuilder*)

    - name: Upload firmware for artifact
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
      with:
        name: ${{ env.VERSION }}_${{ matrix.target }}
        path: |
          openwrt/bin/targets/

    - name: Upload firmware for release
      uses: softprops/action-gh-release@master
      continue-on-error: true
      if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        files: |
          openwrt/bin/targets/*/*/*.bin
          openwrt/bin/targets/*/*/*.itb
          openwrt/bin/targets/*/*/sha256sums
          openwrt/bin/targets/*/*/*.config
        name: Kwrt ${{ env.date2 }} ${{ matrix.target }} (Open-Box)
        tag_name: ${{ env.date3 }}_${{ matrix.target }}
        body: |
          - 目标: `${{ matrix.target }}` (Redmi AX5 JDCloud)
          - 已内置插件: **Open-Box** (`luci-app-open-box`)
          - 日期: ${{ env.date2 }}

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      continue-on-error: true
      if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
